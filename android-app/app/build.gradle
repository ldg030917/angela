apply plugin: 'com.android.application'

android {
    namespace 'kr.angela.inventory'
    compileSdk 35

    defaultConfig {
        applicationId 'kr.angela.inventory'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    sourceSets.main.assets.srcDirs(layout.buildDirectory.dir('generated/web-assets'))
}

tasks.register('prepareWebAssets', Copy) {
    from('../../public') { include 'app.js', 'style.css' }
    from('../..') { include 'normalize.mjs', 'physical-id.mjs', 'status.mjs' }
    from('src/main/web') { include 'mobile.html' }
    into layout.buildDirectory.dir('generated/web-assets')
}
tasks.named('preBuild').configure { dependsOn tasks.named('prepareWebAssets') }
